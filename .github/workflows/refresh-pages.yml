name: Refresh forecast and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public bundle
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Refresh forecast snapshot
        run: node refresh.mjs site/forecast.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Keep scheduled refresh active
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          last_commit="$(git log -1 --format=%ct)"
          now="$(date +%s)"
          if (( now - last_commit > 2592000 )); then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .schedule-keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .schedule-keepalive
            git commit -m "Keep scheduled forecast refresh active"
            git push
          fi

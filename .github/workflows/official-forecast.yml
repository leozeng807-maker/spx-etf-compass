name: Record official forecast snapshot

on:
  schedule:
    - cron: "17 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record post-close forecast
        run: curl --fail --show-error --silent --retry 2 "https://spx-etf-compass-cn.pages.dev/api/forecast?official=1"
